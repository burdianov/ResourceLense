services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resourcelense
      POSTGRES_USER: resourcelense
      POSTGRES_PASSWORD: resourcelense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U resourcelense -d resourcelense"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: